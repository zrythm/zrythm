#
# Inventory of third-party components shipped with Zrythm.
# Single source of truth for the CycloneDX SBOM (tools/generate_sbom.py) and
# the in-app attribution display (tools/generate_attributions.py).
# Validated by tools/dependency_manifest.py; kept honest by
# tools/check_dependencies.py (runs in CI).
#
# tier:    conan | cpm | vendored | asset
# version: forbidden for tier "conan" (taken from the resolved Conan graph);
#          required for tier "cpm" (checked against package-lock.cmake);
#          optional for vendored entries without an in-tree version
# spdx:    SPDX id or expression; every id must have a license text in
#          LICENSES/ or data/licenses/
# shipped: false for build-only/test-only components (excluded from SBOM and
#          the attribution display)

